<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="subtleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="397" height="397" rx="34.5" stroke="#93C5FD" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Geometric Grid Accent -->
  <g opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="400" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="160" y1="0" x2="160" y2="400" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="240" y1="0" x2="240" y2="400" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="320" y1="0" x2="320" y2="400" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="80" x2="400" y2="80" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="160" x2="400" y2="160" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="240" x2="400" y2="240" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="320" x2="400" y2="320" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Central Circular Aura -->
  <circle cx="200" cy="180" r="110" fill="url(#subtleGrad)" />
  <circle cx="200" cy="180" r="85" fill="#FFFFFF" opacity="0.85" filter="drop-shadow(0px 8px 16px rgba(37, 99, 235, 0.08))" />

  <!-- Minimalist Tech Silhouette / Avatar Glyph -->
  <g fill="#2563EB">
    <!-- Head -->
    <circle cx="200" cy="150" r="42" fill="#2563EB" opacity="0.9" />
    <!-- Shoulders / Torso -->
    <path d="M130 265 C130 215, 160 198, 200 198 C240 198, 270 215, 270 265 Z" fill="#1D4ED8" opacity="0.85" />
    <!-- Glasses / Tech Accent -->
    <rect x="175" y="142" width="22" height="13" rx="4" fill="#FFFFFF" />
    <rect x="203" y="142" width="22" height="13" rx="4" fill="#FFFFFF" />
    <line x1="197" y1="148" x2="203" y2="148" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- Editorial Monogram Badge -->
  <g transform="translate(145, 290)">
    <rect width="110" height="34" rx="17" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))" />
    <circle cx="20" cy="17" r="4" fill="#22C55E" />
    <text x="32" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E40AF" letter-spacing="0.5">AR • CSE</text>
  </g>

  <!-- Code Brackets Decors -->
  <text x="45" y="90" font-family="'Space Grotesk', monospace" font-size="32" font-weight="700" fill="#2563EB" opacity="0.3">&lt;/&gt;</text>
  <text x="315" y="340" font-family="'Space Grotesk', monospace" font-size="32" font-weight="700" fill="#2563EB" opacity="0.3">{ }</text>
</svg>

